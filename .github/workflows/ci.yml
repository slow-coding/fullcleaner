name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      # build.sh compiles, runs the offline static checks, draws the icon, assembles the app,
      # runs the self test in a temp sandbox, and packages a dmg.
      - name: Build + self test
        run: ./build.sh

      - name: Offline check (source / binary / runtime)
        run: ./tools/offline-test.sh

      - name: Release audit
        run: |
          # The audit looks at the repository identity; CI is a fresh clone, so set a neutral one first
          git config --local user.name "ci"
          git config --local user.email "ci@users.noreply.github.com"
          ./tools/release-audit.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullCleaner-dmg
          path: build/FullCleaner-*.dmg
